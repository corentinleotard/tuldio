services:
  # ── PostgreSQL ──────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuldio
      POSTGRES_USER: tuldio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuldio"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API ─────────────────────────────
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tuldio:${POSTGRES_PASSWORD}@postgres:5432/tuldio
      PORT: 3003
      FILES_DIR: /var/tuldio/files
    volumes:
      - files:/var/tuldio/files

  # ── Crons ───────────────────────────
  crons:
    build:
      context: .
      target: crons
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tuldio:${POSTGRES_PASSWORD}@postgres:5432/tuldio
      FILES_DIR: /var/tuldio/files
    volumes:
      - files:/var/tuldio/files

  # ── Caddy (web + reverse proxy) ────
  caddy:
    build:
      context: .
      target: caddy
      args:
        VITE_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  files:
  caddy-data:
  caddy-config:
